substitutions:
  _API_BASE_URL: https://example.com/api/v1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - VITE_API_BASE_URL=${_API_BASE_URL}
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/pitch-vision/web:latest
      - .

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/pitch-vision/web:latest
